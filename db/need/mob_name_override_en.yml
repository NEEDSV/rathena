# NEED Phase 0.23 + 0.27 + 0.28 - English names for SPAWN-TIME OVERRIDE literals.
#
# override_mob_names: 0 (conf/battle/monster.conf:123) makes a spawn-file or script literal
# beat the mob_db display name, so 902 loaded name sites show something other than the
# database name. This table gives such a site its own English name for an EN session only.
#
# Key: (MobId, KrName), where KrName is the literal EXACTLY as the spawn file writes it -
# that is the string the server holds in mob_data::name at display time. The Korean literal is
# never modified anywhere; it is the key, and it stays what a Korean session reads.
#
# ENCODING: cp949, like db/re/mob_db.yml. KrName is compared byte for byte against bytes that
# came out of a cp949 spawn file, so this file must not be saved as UTF-8.
#
# NOTE: no "---" document marker. rAthena's YamlDatabase (rapidyaml) kills the whole process
# with STATUS_STACK_BUFFER_OVERRUN (0xC0000409) when a database file begins with one - measured
# in Phase 0.22 by bisecting this very file. No stock db/*.yml has one.
#
# A KrName whose bytes a plain YAML scalar would change (leading/trailing space, a leading
# indicator character) is written single-quoted. Mob 3444 is the only such row in 232 keys.
#
# Nothing here is a lookup key: mob_db_searchname / @mobinfo / @monster never see these
# strings. Deleting this file is a complete rollback to the Phase 0.21 state; restoring
# mob_name_override_en.yml.poc16 rolls back to the Phase 0.22 PoC (16 rows). Neither needs a
# rebuild.
#
# EXCLUDED ON PURPOSE - do not "complete" this table without a decision:
#   13 REVIEW keys (리히테른 / 심연의 코볼트 / 아크라우스 / 셰실 디먼 / 카트린느 케이론) where one
#   Korean name maps to several different English ones, so adopting them would show English
#   players a distinction Korean players do not see.
#   5 dynamic sites whose name is built at runtime.
#
# GENERATED - regenerate with
#   en_build/script_localization/p23_build.py
# Source of truth (every string copied verbatim, nothing re-translated):
#   en_build/script_localization/phase22_override_unique_mappings.csv
