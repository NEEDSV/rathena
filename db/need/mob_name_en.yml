###########################################################################
# NEED English Monster Display Name Database   (Phase 0.25 bulk + Phase 0.27)
###########################################################################
#
# Player-visible ENGLISH monster names for an EN session
# (map_session_data::need_lang). Read into s_mob_db::jname_en, which is
# DISPLAY ONLY and is compared by NO lookup path - mob_db_searchname and
# mob_db_searchname_array (mob.cpp:279-292) match sprite / name / jname and
# never this field, so a script `monster "...","<name>",id` and @monster
# keep resolving exactly as before.
#
# A monster whose display name was overridden at spawn time keeps that
# literal: mob_display_name() only substitutes from this table while
# md.name still equals db->jname (conf/battle/monster.conf
# override_mob_names: 0 means a spawn file or script literal wins). Such a
# spawn override is served by db/need/mob_name_override_en.yml instead
# (Phase 0.22 / 0.23, 132 mappings), and the two tables cannot overlap.
#
# SOURCE: upstream rAthena at the fork point c34f8a38c, matched on EXACT
# AegisName identity, field `Name:`. Copied verbatim - no translation, no
# spelling correction. See
#   en_build/script_localization/phase21_mob_name_source_coverage.csv
#   en_build/script_localization/phase25_bulk_manifest.csv
#
# ENCODING: pure ASCII, LF endings, and NO "---" document marker. rAthena's
# YamlDatabase (rapidyaml) kills the whole process with
# STATUS_STACK_BUFFER_OVERRUN (0xC0000409) when a database file begins with
# one - measured in Phase 0.22.
#
# EXCLUDED ON PURPOSE - do not "complete" this table without a decision:
#   14 CUSTOM_NEED monster ids that do not exist upstream (id 3139 is the
#      one exception: Phase 0.21 already gave it a hand-written name and
#      that row is carried over untouched, not re-applied).
#   41 SAFE rows that cannot be represented in a NAME_LENGTH field: 39
#      whose official name is 24 bytes (upstream's own truncations) and 2
#      that are not ASCII. Listed in phase25_length_gate.csv.
#
# This file is OPTIONAL. Deleting it returns every session to the Korean
# names and logs an [Info] line, not an [Error]. Restoring
# mob_name_en.yml.poc13 rolls back to the Phase 0.21 PoC (13 rows). Neither
# needs a rebuild.
#
# GENERATED - regenerate with
#   en_build/script_localization/p25_build.py
###########################################################################
# - Id            monster id, must exist in mob_db
#   AegisName     checked against mob_db and never stored - it is only here
#                 so a row that has drifted is reported, not applied
#   NameEN        English display name. ASCII, at most 23 bytes.
###########################################################################

Header:
  Type: NEED_MOB_NAME_EN_DB
  Version: 1

