# Whitelist and rotation: NEED_Daily_Quest_Delivery_Monster_Whitelist_v0_7.md (sections 1 and 3).
#
# Track        Lower bound of the level range; must equal MinLevel. The account locks the
#              range of the character's REAL level at its first score of the day.
# Delivery.Stages    Amount delivered by one character -> cumulative points. Stage keys are
#                    d1, d2, ... in this order.
# Delivery.Maps      Map + whitelisted monsters (AegisName) + Rate (per 10000, one independent
#                    roll per candidate). Anything not listed never counts.
# Delivery.Maps.QuestId  Quest window entry of that track + map (99100-99199, unique). The quest
#                    window only shows the ledger: kills never count for 99000-99999 by themselves.
# Delivery.Rotation  Map of each logical weekday (the 04:00 day). A map may not serve two
#                    tracks on the same weekday (decision D10, ver_eju).
# Hunt               Accepted together with the delivery at the NPC (decision 2026-10-21). Every
#                    qualifying kill (same party rule as the delivery) counts 1 for each candidate; a
#                    stage scores the moment its Amount is reached (spec 4.5). Maps + Monsters are the
#                    regular spawns of the hunting ground; bosses, champions, events and mobs whose level
#                    does not fit the track are excluded. Hunt maps may not be delivery maps.
#                    QuestId: quest window entry (99200-99299).
# Battleground       Optional, Lv150 and up only (phase 3). Accepted with the daily quest. A game counts
#                    when the player was in the battle from its start, is on the map at the reward, the
#                    battle lasted 6 min (Tierra, Flavius) / 3 min (KVM), the player acted at least once,
#                    and 75% of the participants have distinct IPs (U9). QuestId: 99300-99399.
# Every track must load; any error disables the daily quest.

