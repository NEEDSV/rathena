# ============================================================
# NEED Rune Tablet - Rune DB Additions
# 전투 룬 세트 1종
# - 기존 원본 Imperfect_Rune / Perfect_Rune 사용
# - 6조각 구성
# - 2/4/6 세트 효과
# - 강화 +1부터 실패 가능
# - 실패 시 ChancePerFail 누적
# - 룬 정제석 1개 = 100,000z 기준, 활성화/강화 제니 비용 10배 반영
# Chance 단위: 100000 = 100%
# ============================================================

