# ============================================================
# NEED Rune Tablet - Rune DB Additions
# 전투 룬 세트 1종
# - 기존 원본 Imperfect_Rune / Perfect_Rune 사용
# - 6조각 구성
# - 2/4/6 세트 효과
# - 강화 +1부터 실패 가능
# - 실패 시 ChancePerFail 누적
# - 룬 정제석 1개 = 100,000z 기준, 활성화/강화 제니 비용 10배 반영
# Chance 단위: 100000 = 100%
# ============================================================

Header:
  Type: RUNE_DB
  Version: 1

Body:
  - Id: 600
    Name: NEED
    Set:
      - Id: 1261000
        Name: Rt_Need_Battle
        Books:
          - Slot: 0
            Name: Rp_Need_Battle_Str
          - Slot: 1
            Name: Rp_Need_Battle_Hit
          - Slot: 2
            Name: Rp_Need_Battle_Fighter
          - Slot: 3
            Name: Rp_Need_Battle_Fierce
          - Slot: 4
            Name: Rp_Need_Battle_Weapon
          - Slot: 5
            Name: Rp_Need_Battle_War
        # 원본 포맷상 세트 자체 활성화 비용.
        # 조각 활성화 비용과 별개이며, 원치 않으면 재료량을 낮춰도 됩니다.
        Activation:
          - Material: Imperfect_Rune
            Amount: 300
          - Material: Perfect_Rune
            Amount: 1
          - Material: Need_Combat_Engrave_Seal
            Amount: 5
          - Material: Need_Rune_Refine_Stone
            Amount: 500
        Scripts:
          # 2조각 효과
          # +0~4: ATK +20
          # +5~9: ATK +25
          # +10~15: ATK +30
          - Amount: 2
            Script: |
              .@grade = getupgrade_rune();
              bonus bBaseAtk,(.@grade >= 10 ? 30 : (.@grade >= 5 ? 25 : 20));

          # 4조각 효과
          # +0~9: HIT +5 / 일반 몬스터 물리 데미지 +2%
          # +10~14: HIT +10 / 일반 몬스터 물리 데미지 +2%
          # +15: HIT +10 / 일반 몬스터 물리 데미지 +3%
          - Amount: 4
            Script: |
              .@grade = getupgrade_rune();
              bonus bHit,(.@grade >= 10 ? 10 : 5);
              bonus2 bAddClass,Class_Normal,(.@grade >= 15 ? 3 : 2);

          # 6조각 효과
          # +0~4: ATK +10 / 일반 몬스터 물리 데미지 +2% / 보스 물리 데미지 +1%
          # +5~9: ATK +15 / 일반 몬스터 물리 데미지 +2% / 보스 물리 데미지 +1%
          # +10~14: ATK +15 / 일반 몬스터 물리 데미지 +3% / 보스 물리 데미지 +1%
          # +15: ATK +20 / 일반 몬스터 물리 데미지 +3% / 보스 물리 데미지 +2%
          - Amount: 6
            Script: |
              .@grade = getupgrade_rune();
              bonus bBaseAtk,(.@grade >= 15 ? 20 : (.@grade >= 5 ? 15 : 10));
              bonus2 bAddClass,Class_Normal,(.@grade >= 10 ? 3 : 2);
              bonus2 bAddClass,Class_Boss,(.@grade >= 15 ? 2 : 1);

        Upgrades:
