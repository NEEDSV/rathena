###########################################################################
# Item Combo Database
###########################################################################
#
# Settings
#
###########################################################################
# - Combos:                 List of combo sets.
#    - Combo:               Sequence of items to define a combo (minimum of 2 items).
#       - <item name>       AEGIS name of the item
#   Script                  Script to execute when one of the combos is equipped. (Default: null)
#   Clear                   Remove the defined combos from database. (Default: false)
###########################################################################

Header:
  Type: COMBO_DB
  Version: 1

Body:
#===== NEED 2026-10-13: 초보자 장비 상향 (CM 개선안) =====================
# 기존 세트 제거 : 방어구 5부위 / 무기 + 방어구 5부위 (re/item_combos.yml)
  - Combos:
      - Combo:
          - Rebeginer_WL_Staff
          - Rebeginer_Cap
          - Rebeginer_Suits
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
      - Combo:
          - Rebeginer_Cap
          - Rebeginer_Suits
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
      - Combo:
          - Rebeginer_SR_Nuckle
          - Rebeginer_Suits
          - Rebeginer_Cap
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
      - Combo:
          - Rebeginer_RK_T_Sword
          - Rebeginer_Suits
          - Rebeginer_Cap
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
      - Combo:
          - Rebeginer_LG_Lance
          - Rebeginer_Suits
          - Rebeginer_Cap
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
      - Combo:
          - Rebeginer_GC_Katar
          - Rebeginer_Suits
          - Rebeginer_Cap
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
      - Combo:
          - Rebeginer_RL_Gun
          - Rebeginer_Suits
          - Rebeginer_Cap
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
      - Combo:
          - Rebeginer_NC_Mace
          - Rebeginer_Suits
          - Rebeginer_Cap
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
      - Combo:
          - Rebeginer_GN_Sword
          - Rebeginer_Suits
          - Rebeginer_Cap
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
      - Combo:
          - Rebeginer_KO_Humma
          - Rebeginer_Suits
          - Rebeginer_Cap
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
      - Combo:
          - Rebeginer_N2_Mace
          - Rebeginer_Suits
          - Rebeginer_Cap
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
      - Combo:
          - Rebeginer_RN_Bow
          - Rebeginer_Suits
          - Rebeginer_Cap
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
      - Combo:
          - Rebeginer_WM_Bow
          - Rebeginer_Suits
          - Rebeginer_Cap
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
      - Combo:
          - Rebeginer_SO_Rod
          - Rebeginer_Suits
          - Rebeginer_Cap
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
      - Combo:
          - Rebeginer_DO_Rod
          - Rebeginer_Suits
          - Rebeginer_Cap
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
      - Combo:
          - Rebeginer_AB_Bible
          - Rebeginer_Suits
          - Rebeginer_Cap
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
      - Combo:
          - Rebeginer_SC_Dagger
          - Rebeginer_Suits
          - Rebeginer_Cap
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
    Clear: true
# 방어구 5부위 : 캐스팅이 끊기지 않음 (공성 / 전장 제외)
  - Combos:
      - Combo:
          - Rebeginer_Cap
          - Rebeginer_Suits
          - Rebeginer_Manteau
          - Rebeginer_Boots
          - Rebeginer_Ring
    Script: |
      bonus bNoCastCancel;
# 캡 + 슈츠 (세트 조건 완화)
  - Combos:
      - Combo:
          - Rebeginer_Cap
          - Rebeginer_Suits
    Script: |
      if (BaseLevel >= 125) {
         bonus bBaseAtk,30;
         bonus bMatk,30;
      }
      if (BaseLevel >= 130) {
         bonus bMaxHPrate,1;
         bonus bMaxSPrate,1;
      }
      autobonus "{}",40,100,BF_WEAPON,"{ heal 500,50; }";
      autobonus "{}",40,100,BF_MAGIC,"{ heal 250,100; }";
# 무기 + 슈츠 (세트 조건 완화)
  - Combos:
      - Combo:
          - Rebeginer_WL_Staff
          - Rebeginer_Suits
    Script: |
      bonus bMatk,3*(min(BaseLevel,150)/10);
      bonus bVariableCastrate,-15;
      bonus2 bMagicAtkEle,Ele_Fire,10;
  - Combos:
      - Combo:
          - Rebeginer_SR_Nuckle
          - Rebeginer_Suits
      - Combo:
          - Rebeginer_RK_T_Sword
          - Rebeginer_Suits
      - Combo:
          - Rebeginer_LG_Lance
          - Rebeginer_Suits
      - Combo:
          - Rebeginer_GC_Katar
          - Rebeginer_Suits
    Script: |
      bonus bBaseAtk,3*(min(BaseLevel,150)/10);
      bonus bAtkRate,5;
      bonus bAspd,1;
      bonus2 bAddClass,Class_All,5;
  - Combos:
      - Combo:
          - Rebeginer_RL_Gun
          - Rebeginer_Suits
      - Combo:
          - Rebeginer_NC_Mace
          - Rebeginer_Suits
      - Combo:
          - Rebeginer_GN_Sword
          - Rebeginer_Suits
    Script: |
      bonus bBaseAtk,3*(min(BaseLevel,150)/10);
      bonus bLongAtkRate,10;
      bonus bAspd,1;
  - Combos:
      - Combo:
          - Rebeginer_KO_Humma
          - Rebeginer_Suits
    Script: |
      bonus bBaseAtk,3*(min(BaseLevel,150)/10);
      bonus bVariableCastrate,-10;
      bonus bMatkRate,6;
      bonus bAtkRate,6;
  - Combos:
      - Combo:
          - Rebeginer_N2_Mace
          - Rebeginer_Suits
    Script: |
      bonus bBaseAtk,3*(min(BaseLevel,150)/10);
      bonus bBaseAtk,80;
      bonus bAspd,1;
  - Combos:
      - Combo:
          - Rebeginer_RN_Bow
          - Rebeginer_Suits
    Script: |
      bonus bBaseAtk,3*(min(BaseLevel,150)/10);
      bonus bLongAtkRate,10;
      bonus bAtkRate,2;
  - Combos:
      - Combo:
          - Rebeginer_WM_Bow
          - Rebeginer_Suits
    Script: |
      bonus bBaseAtk,3*(min(BaseLevel,150)/10);
      bonus bLongAtkRate,10;
      bonus bVariableCastrate,-10;
  - Combos:
      - Combo:
          - Rebeginer_SO_Rod
          - Rebeginer_Suits
    Script: |
      bonus bMatk,3*(min(BaseLevel,150)/10);
      bonus2 bMagicAtkEle,Ele_Neutral,10;
      bonus bVariableCastrate,-10;
  - Combos:
      - Combo:
          - Rebeginer_DO_Rod
          - Rebeginer_Suits
    Script: |
      bonus bMatk,3*(min(BaseLevel,150)/10);
      bonus bVariableCastrate,-10;
      bonus bMatkRate,10;
  - Combos:
      - Combo:
          - Rebeginer_AB_Bible
          - Rebeginer_Suits
    Script: |
      bonus bMatk,3*(min(BaseLevel,150)/10);
      bonus2 bMagicAtkEle,Ele_Holy,10;
      bonus bVariableCastrate,-10;
  - Combos:
      - Combo:
          - Rebeginer_SC_Dagger
          - Rebeginer_Suits
    Script: |
      bonus bMatk,3*(min(BaseLevel,150)/10);
      bonus bAspdRate,5;
      bonus bAspd,1;
      bonus2 bMagicAtkEle,Ele_All,5;
