#=====================================================================
# [NEED] 아래 블록은 "휴면" 상태입니다 - 로더가 읽지 않습니다.
#
# 이 파일도 UTF-8 BOM 때문에 여태 0건으로 로드되고 있었습니다. 아래
# 드롭 차단 19종(봉인 보스카드 13 / 의상 3 / 원념의 조각 등 3)은 지금까지
# 적용된 적이 없습니다. 2026-09-18 BOM 을 제거했지만 그대로 살리면
# 전사자의 무덤 드롭 구성이 즉시 바뀌므로(요청 범위 밖) 키 이름을
# Body -> DormantBody 로 바꿔 휴면 상태를 유지했습니다.
#
# 실제로 적용하려면 "DormantBody_TombOfTheFallen:" 를 "Body:" 로 되돌리고
# 파일 맨 아래의 현재 "Body:" 항목을 그 아래로 합치면 됩니다.
#=====================================================================
