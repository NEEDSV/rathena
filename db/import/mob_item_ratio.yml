###########################################################################
# Mob Item Ratio Database
###########################################################################
#
# Mob Item Ratio Settings
#
###########################################################################
# - Item          AegisName of item to adjust.
#   Ratio         Drop rate.
#   List:         List of monster(s) affected (format <Aegis monster name>: true/false). (Defaulted to all monsters)
###########################################################################

Header:
  Type: MOB_ITEM_RATIO_DB
  Version: 1

#===== NEED Tomb of the Fallen - 2015 Drop Cleanup ===========
# 2015-12 대개편 기준 전사자의 무덤 드롭 차단 목록.
#
# 2013 -> 2015 에서 차단 해제 (이 파일에서 항목 삭제):
#   - Particles_Of_Energy5 (타락한 에너지파편) : 일반 전사자 13종
#       base Rate 1000 x 보스 배율 10 -> NEED 배율 적용 결과 100% / 공식 확률 미확정
#   - Real_*_Card (진 전사자 카드) 13종         : 일반 전사자 13종
#   - Crystal_Of_Grudge (원념의 결정)          : MVP 13종 (2015-12-30)
#       base Rate 3000 x MVP 배율 10 -> NEED 배율 적용 결과 100% / 공식 확률 미확정
#   MVP 카드 13종은 원래 이 파일이 아니라 db/import/mob_db.yml 의
#   placeholder 로 막혀 있었고, 그쪽에서 Index 7 로 복구했다.
#
#   - Pieces_Of_Grudge (원념의 파편) 일반 13종 차단 해제
#       Rate 20 슬롯 1개만 남김 -> 최종 2% (보스 배율 x10). Rate 40 슬롯은 mob_db import 에서 제거.
#
# 계속 차단:
#   - Pieces_Of_Grudge : MVP 13종 (db/import/mob_db.yml placeholder 용)
#   - Crystal_Of_Grudge : 일반 3종 에레메스/셰실/랜달 (placeholder 용)
#   - 후기 추가 의상 3종 (2015 근거 없음)
#
# [NEED] 이 Body 는 2026-09-21(7dabd429e) DormantBody -> Body 로 되돌려
# 실제로 로드되고 있다. (UTF-8 BOM 을 붙이면 Body 가 0건으로 조용히 무시된다)
#=============================================================
Body:
  #-----------------------------------------------------------
  # 원념의 파편 - MVP 13종 placeholder 전용 차단
  #   db/import/mob_db.yml 의 MVP MvpDrops 0~2 / Drops 4~6 placeholder.
  #   일반 13종은 차단 해제 (Rate 20 슬롯 1개만 남겨 최종 2%).
  #-----------------------------------------------------------
  - Item: Pieces_Of_Grudge
    Ratio: 0
    List:
      V_B_EREMES: true
      V_B_MAGALETA: true
      V_B_SHECIL: true
      V_B_HARWORD: true
      V_B_KATRINN: true
      V_B_SEYREN: true
      V_B_RANDEL: true
      V_B_FLAMEL: true
      V_B_CELIA: true
      V_B_CHEN: true
      V_B_GERTIE: true
      V_B_ALPHOCCIO: true
      V_B_TRENTINI: true

  #-----------------------------------------------------------
  # 원념의 결정 - 일반 3종 placeholder 전용 차단
  #   db/import/mob_db.yml 에서 원념의 파편 Rate 40 슬롯을 덮어쓴 placeholder.
  #   MVP 의 원념의 결정 드롭과는 무관 (이 3종에만 적용).
  #-----------------------------------------------------------
  - Item: Crystal_Of_Grudge
    Ratio: 0
    List:
      V_EREMES: true
      V_SHECIL: true
      V_RANDEL: true

  #-----------------------------------------------------------
  # 후기 추가 의상
  #-----------------------------------------------------------
  - Item: C_Silent_Executer
    Ratio: 0
    List:
      V_EREMES: true

  - Item: C_Sniper_Goggle
    Ratio: 0
    List:
      V_SHECIL: true

  - Item: C_Schmidt_Helm
    Ratio: 0
    List:
      V_RANDEL: true

  #-----------------------------------------------------------
  # NEED 완화 2차 - 옛 글래스트헤임(상급) 오염된 마력
  #   서버 일반 드롭 배율(item_rate_common: 2000 = 20배)을 우회해
  #   mob_db 의 Rate 를 그대로 최종 확률로 쓰기 위한 고정값이다.
  #   Ratio 100 = 1배 -> Rate 50 = 0.50% 가 그대로 최종 기본 확률이 된다.
  #   풍선껌 등 처치 시점 드롭률 증가는 이 값과 무관하게 정상 적용된다.
  #   아래 5종은 상급 인스턴스의 일반 몬스터다.
  #   3142 MG_ARCLOUSE_H(구더기)는 무한 소환이 가능해 의도적으로 제외했다.
  #-----------------------------------------------------------

#=====================================================================
# [NEED] 실제 로드되는 Body - 2차 완화 작업 추가분
#=====================================================================

  - Item: Polluted_Spell
    Ratio: 100
    List:
      MG_ZOMBIE_H: true
      MG_WRAITH_H: true
      MG_GHOUL_H: true
      MG_RAYDRIC_H: true
      MG_RAYDRIC_ARCHER_H: true
      MG_KNIGHT_OF_ABYSS_H: true
      MG_KHALITZBURG_H: true
      MG_BLOODY_KNIGHT_H: true
