  - Id: 399906
    AegisName: Lucky_Gold_Cash_Bag
    Name: 행운 금화 주머니
    Type: Usable
    Flags:
      Container: true
    Weight: 0
    Script: |
      .@r = rand(10000);

      if (.@r < 1) {
          .@amount = 1000;
          .@announce = 1;
      } else if (.@r < 10) {
          .@amount = 500;
          .@announce = 1;
      } else if (.@r < 100) {
          .@amount = 100;
          .@announce = 1;
      } else if (.@r < 400) {
          .@amount = 50;
      } else if (.@r < 1200) {
          .@amount = 10;
      } else if (.@r < 4900) {
          .@amount = 5;
      } else {
          .@amount = 3;
      }

      getitem 399990, .@amount;

      if (.@announce) {
          announce "[행운 금화 주머니] " + strcharinfo(0) + "님이 금화 " + .@amount + "개를 획득했습니다!", bc_all;
      }
