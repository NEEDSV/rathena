###########################################################################
# Instance Database
###########################################################################
#
# Instance Settings
#
###########################################################################
# - Id                Instance ID.
#   Name              Instance Name.
#   TimeLimit         Total lifetime of instance in seconds. Use 0 to define infinite time. (Default: 3600)
#   IdleTimeOut       Time before an idle instance is destroyed in seconds. Use 0 to define infinite idle time. (Default: 300)
#   NoNpc             Prevent copying NPCs from the source map. (Default: false)
#   NoMapFlag         Prevent copying Mapflags from the source map. (Default: false)
#   Destroyable       Toggles the ability to destroy the instance using instance 'Destroy' button. (Default: true)
#                     Note: the button is displayed based on parties. For any mode, it requires the party leader to be the instance owner to destroy it.
#   Enter:            Instance entrance coordinates.
#     Map             Map Name where players start.
#     X               X Coordinate where players start.
#     Y               Y Coordinate where players start.
#   AdditionalMaps:   List of maps that are part of an instance. (Optional)
###########################################################################

Header:
  Type: INSTANCE_DB
  Version: 2

Body:
  # NEED 2026 halloween jack game (npc/NEED/need_halloween.txt), personal (IM_CHAR).
  # Base map pvp_n_1-2 (a PvP map resource): NoNpc keeps its NPCs out of the copy. Map flags are
  # copied, then the entry NPC turns pvp / gvg / battleground off on the instance map only.
  # Do not add NoMapFlag: on a never-used instance slot the flag array stays empty and the
  # script's setmapflag on that map crashes the map-server (seen on the test server).
  # TimeLimit covers the 3 minute game plus margin; IdleTimeOut cleans up after a logout.
  - Id: 1031
    Name: 할로윈 잭 잡기
    NameEn: Halloween Jack Catch
    TimeLimit: 240
    IdleTimeOut: 15
    NoNpc: true
    Destroyable: false
    Enter:
      Map: pvp_n_1-2
      X: 100
      Y: 100
  # NEED 2026 halloween Jack Rush (npc/NEED/need_halloween_rush.txt), personal (IM_CHAR), same base map
  # and map-flag handling as 1031. A round = 3 s countdown + 60 s + the result screen; every retry
  # makes a new instance. TimeLimit 300 still ends a result screen left open; IdleTimeOut after a logout.
  - Id: 1032
    Name: 할로윈 잭 러시
    NameEn: Halloween Jack Rush
    TimeLimit: 300
    IdleTimeOut: 15
    NoNpc: true
    Destroyable: false
    Enter:
      Map: pvp_n_1-2
      X: 100
      Y: 100
