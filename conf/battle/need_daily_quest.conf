// NEED daily quest (phase 1: account day ledger + virtual delivery).
//
// Needs the tables of sql-files/need_daily_quest.sql and db/need/daily_quest.yml.
// When the tables or the configuration are invalid the feature stays off and the
// map-server prints the reason at start.
//
// Phase 1 is tested in the isolated environment only. Keep this off on the live
// server until the operator approves the release.

// Enable the daily quest. (Note 1)
need_daily_quest_enable: yes

// Print every pending write (flush) to the console. (Note 1)
need_daily_quest_debug: no
