// NEED Lucky Egg bonus settings.
//
// A bonus roll that runs AFTER the lucky egg has already handed out its normal
// contents. The existing item groups and their relative weights are never
// touched, so core reward rates stay exactly as they were.
//
// The check is keyed on db/need/lucky_egg_db.yml: every item listed there is
// treated as a lucky egg. Registering a new egg in that database is enough for
// the bonus to apply - no per-item script edit is needed.

// Enable the bonus roll. (Default: yes)
need_lucky_egg_bonus_enable: yes

// Bonus chance, fixed denominator of 10000: 10000 = 100%, 1000 = 10%, 100 = 1%.
// (Default: 1000 = 10%)
need_lucky_egg_bonus_rate: 1000

// Item handed out when the roll succeeds.
// 900124 = Need_Unstable_Rune_Box (불안정한 룬 상자)
need_lucky_egg_bonus_item_id: 900124

// Amount handed out when the roll succeeds. (Default: 1)
need_lucky_egg_bonus_amount: 1
