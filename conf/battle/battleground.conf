//--------------------------------------------------------------
// rAthena 전투 설정 파일
// 원문 번역: Peter Kieser [pfak@telus.net](mailto:pfak@telus.net)
// Ancyker가 더 쉬운 영어로 수정
//--------------------------------------------------------------
// Note 1: 설정 스위치 값입니다. on/off, yes/no 또는 1/0 형식입니다.
// Note 2: 퍼센트 값입니다. 100은 100%를 의미합니다.
// Note 3: 비트 필드 값입니다. 별도 설명이 없으면 유닛 타입 기준으로 봅니다.
//         1: 플레이어, 2: 몬스터, 4: 펫, 8: 호문클루스, 16: 용병, 128: NPC, 512: 엘리멘탈
//--------------------------------------------------------------

// 전장 맵에서 근접 일반 공격 데미지 보정입니다. 스킬 제외. (Note 2)
bg_short_attack_damage_rate: 60

// 전장 맵에서 원거리 일반 공격 데미지 보정입니다. 스킬 제외. (Note 2)
bg_long_attack_damage_rate: 60

// 전장 맵에서 무기 기반 스킬 데미지 보정입니다. (Note 2)
bg_weapon_attack_damage_rate: 40

// 전장 맵에서 마법 스킬 데미지 보정입니다. (Note 2)
bg_magic_attack_damage_rate: 40

// 전장 맵에서 기타 스킬 데미지 보정입니다. (Note 2)
bg_misc_attack_damage_rate: 40

// 전장 맵에서 적용되는 회피율 패널티입니다.
// 참고: 고정 수치가 아니라 퍼센트입니다. 20이면 총 FLEE의 -20%입니다.
bg_flee_penalty: 20

// 전장 팀원 위치를 미니맵 점으로 갱신하는 간격입니다. 단위는 밀리초입니다.
bg_update_interval: 1000

// 전장 대기열에서 플레이어를 전장으로 워프시키기 전에,
// 플레이어가 현재 있는 맵에 MF_NOWARP 맵플래그가 있는지 확인할지 설정합니다.
bgqueue_nowarp_mapflag: no
