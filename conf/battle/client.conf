//--------------------------------------------------------------
// rAthena 전투 설정 파일
// 원문 번역: Peter Kieser [pfak@telus.net](mailto:pfak@telus.net)
// Ancyker가 더 쉬운 영어로 수정
//--------------------------------------------------------------
// Note 1: 설정 스위치 값입니다. on/off, yes/no 또는 1/0 형식입니다.
// Note 2: 퍼센트 값입니다. 100은 100%를 의미합니다.
// Note 3: 비트 필드 값입니다. 별도 설명이 없으면 유닛 타입 기준으로 봅니다.
//         1: 플레이어, 2: 몬스터, 4: 펫, 8: 호문클루스, 16: 용병
//--------------------------------------------------------------

import: conf/battle/need_world_drop.conf

// 귓속말 / 전체 채팅 / 파티 채팅 / 길드 채팅 메시지 사이의 최소 딜레이입니다. 단위는 밀리초입니다.
// 이 기준보다 빠르게 보내진 메시지는 별도 알림 없이 무시됩니다.
min_chat_delay: 0

// 클라이언트에서 사용할 수 있는 염색 및 스타일 번호 범위입니다.
min_hair_style: 0
max_hair_style: 42
min_hair_color: 0
max_hair_color: 8
min_cloth_color: 0
max_cloth_color: 20

// yes로 설정하면 공성 맵에서 전송되는 패킷의 데미지 값이 -1로 설정됩니다.
// 이로 인해 GM, 봇, 변조 클라이언트가 실제 공격 데미지를 알 수 없게 됩니다. (Note 1)
hide_woe_damage: no

// 펫을 식별하는 "헤어 스타일" 번호입니다.
// 참고: 클라이언트는 몬스터 패킷의 "헤어 스타일" 필드를 사용해 펫과 몬스터를 구분합니다.
// 이 값은 해당 클라이언트에서 사용할 수 있는 최대 헤어 스타일 번호보다 항상 커야 합니다.
// 동작이 확인된 값은 다음과 같습니다. 모든 2005 클라이언트 기준:
// 구형 sakexe: 20
// sakexe 0614: 24
// sakexe 0628 및 이후: 100
pet_hair_style: 100

// 화면 표시 범위입니다. 플레이어 기준 몇 칸 떨어진 곳까지 볼 수 있는지 설정합니다.
area_size: 14

// 최대 이동 경로입니다. 플레이어가 커서를 찍었을 때 한 번에 걸어갈 수 있는 최대 셀 수입니다.
max_walk_path: 17

// 유닛 패킷으로 클라이언트에 전송할 수 있는 최대 '레벨' 값입니다.
// aura_lv 설정과 함께 사용하여 오라가 정확히 언제 표시될지 정합니다.
// 참고: 이 기능을 제대로 사용하려면 클라이언트도 함께 수정해야 합니다.
// 참고: 기본값은 99입니다. 127을 초과하는 값은 비정상적으로 동작할 가능성이 높습니다.
// 참고: 이 설정이 무엇인지 모른다면 변경하지 마세요!!!
max_lv: 99

// 오라를 표시하는 데 필요한 레벨입니다.
// 참고: max_lv 값을 클라이언트에 보내면 오라가 표시된다는 전제의 설정입니다.
// 참고: aura_lv는 max_lv보다 작으면 안 됩니다.
// 예시: max_lv가 99이고 aura_lv가 150이면,
//       99~149레벨 캐릭터는 모두 98레벨로 전송됩니다.
//       150레벨 이상 캐릭터만 99레벨로 전송되어 오라가 표시됩니다.
aura_lv: 99

// max_lv와 aura_lv 설정의 영향을 받을 유닛 타입입니다. (Note 3)
// 참고: 원래 오라가 표시되지 않는 유닛 타입이라도,
//       여기에 설정되어 있고 레벨 조건을 만족하면 오라가 표시됩니다.
// 기본값: 0. 없음
client_limit_unit_lv: 0

// 턱시도와 웨딩드레스를 착용했을 때 실제 외형으로 표시할지 설정합니다. (Note 1)
wedding_modifydisplay: no

// 옷 색상을 저장할지 설정합니다. 이 기능은 성능을 저하시킬 수 있습니다. (Note 1)
save_clothcolor: yes

// 바디 스타일을 저장할지 설정합니다. (Note 1)
save_body_style: yes

// 웨딩 클래스에 옷 색상을 표시하지 않을지 설정합니다.
// 참고: 이 옵션이 적용되려면 save_clothcolor와 wedding_modifydisplay가 모두 활성화되어 있어야 합니다.
// 웨딩 팔레트가 없거나 다른 직업보다 적은 옷 팔레트팩을 사용하는 경우 yes로 설정하세요.
wedding_ignorepalette: no

// 크리스마스 코스튬에 옷 색상을 표시하지 않을지 설정합니다.
// 크리스마스 팔레트가 없거나 다른 직업보다 적은 옷 팔레트팩을 사용하는 경우 yes로 설정하세요.
xmas_ignorepalette: no

// 여름 코스튬에 옷 색상을 표시하지 않을지 설정합니다.
// 여름 팔레트가 없거나 다른 직업보다 적은 옷 팔레트팩을 사용하는 경우 yes로 설정하세요.
summer_ignorepalette: no

// 한복 코스튬에 옷 색상을 표시하지 않을지 설정합니다.
// 한복 팔레트가 없거나 다른 직업보다 적은 옷 팔레트팩을 사용하는 경우 yes로 설정하세요.
hanbok_ignorepalette: no

// 옥토버페스트 코스튬에 옷 색상을 표시하지 않을지 설정합니다.
// 옥토버페스트 팔레트가 없거나 다른 직업보다 적은 옷 팔레트팩을 사용하는 경우 yes로 설정하세요.
oktoberfest_ignorepalette: no

// 클라이언트에 langtype 문제가 있어 MOTD를 정상 표시하지 못하는 경우 1로 설정하세요.
motd_type: 0

// 유저가 로그인할 때 rAthena 버전을 표시할지 설정합니다.
display_version: no

// "환각" 상태 이상에 걸렸을 때 클라이언트에 해당 효과를 전송할지 설정합니다. (Note 1)
// 참고: "물결치는 화면" 효과 때문에 클라이언트 렉이 발생한다면 no로 설정하세요.
display_hallucination: yes

// 클라이언트가 상태 변화 타이머를 지원하고 이를 사용하려면 1로 설정하세요.
// 2009년 이후 클라이언트는 이 기능을 지원합니다.
display_status_timers: yes

// 주사위 이모티콘 결과를 서버 측에서 무작위로 정합니다.
// 클라이언트가 원하는 숫자로 패킷을 조작하는 것을 방지합니다. (Note 1)
client_reshuffle_dice: yes

// 카트, 길드 창고, 인벤토리, 창고 정보를 클라이언트에 보내기 전에 정렬할지 설정합니다. (Note 1)
// 공식 서버는 정렬하지 않습니다.
// 참고: 이 옵션을 활성화하면 성능이 저하됩니다.
client_sort_storage: no

// 투명 상태의 적 위치를 갱신할지 설정합니다. (Note 1)
// 참고: no로 설정하면 플레이어에게 "인사이트 / 인트라비전" 효과가 없는 한,
//       클라이언트가 투명 상태 적의 위치를 갱신하지 않습니다.
//       이는 WPE, 마야 퍼플 핵 같은 클라이언트 조작 대응에 도움이 됩니다.
//       단, 투명 상태 플레이어의 게임 애니메이션 표시가 어색해질 수 있습니다.
update_enemy_position: yes

// 플레이어가 텔레포트, 맵 이동, 로그인할 때 이동 전 바라보던 방향을 유지할지 설정합니다.
// 공식 설정: 비활성화. 플레이어는 항상 북쪽을 바라봅니다.
spawn_direction: no

// 2013-12-23cRagexe 이상 클라이언트에서 MVP EXP 보상 메시지를 표시할지 설정합니다. (Note 1)
// kRO에서 제거된 패킷을 다시 활성화하는 옵션입니다.
// 공식 설정: 비활성화.
mvp_exp_reward_message: no

// 핑 타이머 전송 설정입니다.
// 타이머가 실행되는 간격입니다. 단위는 초입니다.
ping_timer_inverval: 30

// 핑 패킷을 전송할 수 있기 전까지의 패킷 전송 타임아웃 시간입니다. 단위는 초입니다.
ping_time: 20

// 2015-12-23 이상 클라이언트에서 스킬 범위 표시를 보여줄지 설정합니다. (Note 1)
// 공식 설정: yes
show_skill_scale: yes

// 플레이어의 접속 종료 요청을 받은 뒤 서버 측에서 연결을 끊을지 설정합니다. (Note 1)
// 참고: 이 옵션을 활성화하면 REST API 호출을 사용하는 클라이언트에서 문제가 발생할 수 있습니다.
// 공식 설정: no
drop_connection_on_quit: no

// 매크로 감지 재시도 횟수입니다.
// 매크로 감지에 몇 번 실패하면 제재할지 설정합니다.
// 공식 설정: 3. 최소값: 1
macro_detection_retry: 3

// 매크로 감지 제한 시간입니다.
// 이 시간 안에 매크로 감지를 통과하지 못하면 유저가 제재됩니다. 단위는 밀리초입니다.
// 공식 설정: 60000
macro_detection_timeout: 60000

// 매크로 감지 제재 유형입니다.
// 0 - 밴
// 1 - 감옥
// 공식 설정: 0
macro_detection_punishment: 1

// 매크로 감지 제재 지속 시간입니다.
// 선택된 제재 유형이 유지되는 시간입니다. 단위는 분입니다.
// 0을 사용하면 무기한입니다.
// 공식 설정: 0
macro_detection_punishment_time: 1440

// 매크로 감지 중 플레이어가 접속을 종료하면 즉시 제재할지 설정합니다.
// yes: 공식 동작을 유지하며 즉시 제재합니다.
// no: 접속 종료 기록을 남기고, 재접속 시 캡차를 다시 요구합니다.
// 공식 설정: yes
macro_detection_punish_disconnect: no

// 매크로 감지 중 접속 종료 허용 횟수입니다.
// 캡차 중 해결되지 않은 접속 종료가 몇 번 발생하면 제재할지 설정합니다.
// 0으로 설정하면 접속 종료 횟수 기반 제재를 비활성화합니다.
macro_detection_disconnect_retry: 3

// 매크로 검사기 딜레이입니다. 맵별로 적용됩니다.
// 0으로 설정하면 비활성화됩니다.
// 실제 매크로 검사에서 전투/이동/캐스팅을 정리한 뒤 캡차를 표시하기까지의 지연입니다.
// /macro_preview에는 적용되지 않습니다. 단위는 밀리초입니다.
// 기본값: 500. 최솟값: 0. 최댓값: 5000.
macro_checker_display_delay: 500

// 캡챠 상태 전환, 이미지 크기, 타이머 및 ACK 진단 로그를 출력합니다.
// 기본값: no
macro_checker_debug: no

// 인스턴스 맵에서 매크로 캡챠 허용 여부
// 기본값: no
macro_checker_allow_instance: no

// 매크로 캡챠 정답 성공 후 피해 면역 유지 시간(ms)
// 0으로 설정하면 즉시 해제됩니다. 기본값: 1000
macro_checker_success_immunity: 1000

macrochecker_delay: 600000

// NEED 사냥 기반 매크로 검사 확률입니다. 10000 기준입니다.
// 10 = 0.1%. 0으로 설정하면 사냥 기반 자동 발동을 비활성화합니다.
need_macro_hunt_check_rate: 10

// NEED 사냥 기반 매크로 검사 발동 후 재검사 대기 시간입니다. 단위는 밀리초입니다.
need_macro_hunt_delay: 3600000

// NEED 사냥 기반 매크로 검사를 시작하기 전 필요한 최소 처치 수입니다.
// 0으로 설정하면 최소 처치 수 제한이 없습니다.
need_macro_hunt_min_kill_count: 0

// NEED 사냥 기반 매크로 검사의 최대 미검사 처치 수입니다.
// 0으로 설정하면 강제 발동을 비활성화합니다.
need_macro_hunt_force_kill_count: 0

// NEED 사냥 기반 매크로 검사의 최대 미검사 사냥 시간입니다. 단위는 밀리초입니다.
// 0으로 설정하면 강제 발동을 비활성화합니다.
need_macro_hunt_force_time: 0

// NEED 사냥 기반 매크로 검사 디버그 로그입니다.
need_macro_hunt_debug: no

// 시야 범위에 들어올 때 클로킹 상태의 유닛을 숨길지 설정합니다. (Note 3)
// 기본값, 공식 설정: 0
hide_cloaked_units: 0
