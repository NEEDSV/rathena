// NEED world drop settings.
// Rates use a fixed denominator of 10000: 10000 = 100%, 100 = 1%, 10 = 0.1%.

need_world_drop_enable: yes
need_world_drop_debug: no
need_world_drop_allow_gm: yes
need_world_drop_gm_exclude_level: 60
// Fixed at 10000 by the source validator. Keep this value unchanged.
need_world_drop_rate_scale: 10000

// Tier 1: level 30-98 gold coin.
need_world_drop_tier1_enable: yes
need_world_drop_tier1_min_level: 30
need_world_drop_tier1_max_level: 99
need_world_drop_tier1_item_id: 399990
need_world_drop_tier1_base_rate: 50
need_world_drop_tier1_rate_per_level: 1
need_world_drop_tier1_amount: 1

// Tier 2: level 99-154 gold coin.
need_world_drop_tier2_enable: yes
need_world_drop_tier2_min_level: 100
need_world_drop_tier2_max_level: 154
need_world_drop_tier2_item_id: 399990
need_world_drop_tier2_base_rate: 100
need_world_drop_tier2_rate_per_level: 1
need_world_drop_tier2_amount: 1

// Tier 3: level 155-169 mythril coin.
need_world_drop_tier3_enable: yes
need_world_drop_tier3_min_level: 155
need_world_drop_tier3_max_level: 169
need_world_drop_tier3_item_id: 674
need_world_drop_tier3_base_rate: 100
need_world_drop_tier3_rate_per_level: 1
need_world_drop_tier3_amount: 1

// Tier 4: level 170+ mythril coin. max_level 0 means unlimited.
need_world_drop_tier4_enable: yes
need_world_drop_tier4_min_level: 170
need_world_drop_tier4_max_level: 0
need_world_drop_tier4_item_id: 674
need_world_drop_tier4_base_rate: 200
need_world_drop_tier4_rate_per_level: 1
need_world_drop_tier4_amount: 1

// Independent bonus drop for normal monsters.
need_world_drop_bonus_enable: yes
need_world_drop_bonus_min_level: 100
need_world_drop_bonus_max_level: 0
need_world_drop_bonus_item_id: 9530
need_world_drop_bonus_rate: 100
need_world_drop_bonus_amount: 1

// MVP-only reward.
need_world_drop_mvp_enable: yes
need_world_drop_mvp_item_id: 677
need_world_drop_mvp_rate: 5000
need_world_drop_mvp_amount: 1
need_world_drop_mvp_excluded_maps: bossnia_01,bossnia_02,bossnia_03
need_world_drop_mvp_allow_normal_drop: no

// Exclude boss-mode monsters from normal tier and bonus drops.
need_world_drop_exclude_boss_mode: no

// Gold event compatibility.
// 0: disabled, 1: always active, 2: follow $NEED_EVENT_HUNT_GOLD_ON.
need_world_drop_event_mode: 2
need_world_drop_event_rate_multiplier: 12000
need_world_drop_event_target_item_id: 399990
need_world_drop_event_debug_message: yes
need_world_drop_event_debug_gm_level: 60
