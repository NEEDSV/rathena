//--------------------------------------------------------------
// NEED 여름 이벤트 낚시 시스템 (1차 기술 검증)
//--------------------------------------------------------------
// 신규 클라이언트 패킷 없이, 전용 비소모 아이템(기존 아이템 사용 패킷)으로
// 타이밍 입력을 받아 반응 시간을 판정하는 기능입니다.
//
// 이번 단계는 입력/타이밍 판정 안정성 검증용이며 기본적으로 off 입니다.
//--------------------------------------------------------------

// 낚시 기능 활성화 여부 (off 이면 낚시 빌드인/입력이 동작하지 않음)
need_summer_fishing_enable: on

// 디버그 로그 출력 (서버 콘솔)
need_summer_fishing_debug: on

// 입질까지의 무작위 대기 시간 범위 (ms). 테스트 단계 기본 2~5초.
need_summer_fishing_bite_min_ms: 2000
need_summer_fishing_bite_max_ms: 5000

// 입질 후 입력 제한 시간 (ms). 초과 시 자동 실패 처리.
need_summer_fishing_input_window_ms: 1500

// 반응 시간 등급 임계값 (ms). 임시 기준이며 실측 후 조정.
//   Perfect : 0 ~ perfect_ms
//   Great   : perfect_ms+1 ~ great_ms
//   Good    : great_ms+1 ~ good_ms
//   Normal  : good_ms+1 ~ normal_ms
//   Fail    : normal_ms 초과
need_summer_fishing_perfect_ms: 400
need_summer_fishing_great_ms: 650
need_summer_fishing_good_ms: 900
need_summer_fishing_normal_ms: 1200

// 2차 콘텐츠: 추가 릴 감기 대기/입력 제한 시간 (ms)
need_summer_fishing_reel_wait_min_ms: 700
need_summer_fishing_reel_wait_max_ms: 1800
need_summer_fishing_reel_input_window_ms: 1000

// 최초 챔질 성공(HOOKED) 후 스크립트가 need_fishing_set_catch 를 호출할 때까지의
// 처리 제한 시간 (ms). 초과 시 결과 처리 실패로 세션 종료.
need_summer_fishing_result_script_timeout_ms: 3000
