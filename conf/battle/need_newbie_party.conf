// NEED newbie escort party EXP bonus.
//
// When at least one account flagged as a NEED newbie-support account
// (#NEED_BEGINNER, set by npc/NEED/need_beginner.txt) is part of the members
// that actually receive a share of the party EXP, the vanilla
// party_even_share_bonus is REPLACED by the formula below for Base/Job EXP.
// The two bonuses never stack, and Zeny keeps using party_even_share_bonus.
//
// Only EXP that is even-shared from a monster kill is affected. NPC, quest and
// script granted EXP are untouched.

// Enable the NEED newbie escort party EXP bonus. (Note 1)
need_newbie_party_exp_bonus_enable: yes

// Extra total party EXP percentage per additional EXP sharing member.
// 100 means every extra member adds +100% total EXP, so each member keeps
// roughly the same EXP as when hunting solo:
//   2 members -> 200% total, 3 members -> 300% total, 6 members -> 600% total.
// Set to 0 to fall back to the vanilla party_even_share_bonus.
need_newbie_party_exp_bonus: 100

// Maximum number of EXP sharing members credited by the bonus above.
// This does NOT limit the party size nor the number of members that share EXP:
// with 12 sharing members the total EXP is still capped at 600%, and those 12
// members split it evenly.
need_newbie_party_exp_bonus_max_members: 6
