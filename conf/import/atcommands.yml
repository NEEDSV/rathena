###########################################################################
# Atcommand Database
###########################################################################
#
# Atcommand Settings
#
###########################################################################
# - Command                  Command name.
#   Aliases:                 Aliases for the command. (Optional)
#     - <AliasName>
#   Help                     Help message for the command. (Optional)
###########################################################################

Header:
  Type: ATCOMMAND_DB
  Version: 1

Body:
  - Command: needbuildcheck
    Aliases:
      - 장비세팅확인
    Help: |
      Params: <build_id>.
      Displays a stored NEED equipment build snapshot. Admin only by group permissions.
  - Command: needbuildlikesync
    Help: |
      Params: <build_id>.
      Recalculates one equipment build's like_count. Admin only by group permissions.
  - Command: needbuildreward
    Help: |
      Params: processing | <build_id> [check|complete|retry] [CONFIRM].
      Inspects processing rewards or performs an explicitly confirmed manual recovery.
  - Command: needbuildaudit
    Help: |
      Params: <build_id>.
      Read-only consistency audit for one equipment-build reward and its reward log.
